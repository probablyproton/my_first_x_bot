name: Ticker Bot

on:
  schedule:
    - cron: '*/15 6-21 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Write env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > my.env
          echo "EU_WATCHLIST=${{ vars.EU_WATCHLIST }}" >> my.env
          echo "US_WATCHLIST=${{ vars.US_WATCHLIST }}" >> my.env
          echo "EU_FOCUS_TICKER=${{ vars.EU_FOCUS_TICKER }}" >> my.env
          echo "US_FOCUS_TICKER=${{ vars.US_FOCUS_TICKER }}" >> my.env
          echo "SLOT_JITTER_SECONDS=90" >> my.env
          echo "EVENT_INTERVAL_THRESHOLD_PCT=1.5" >> my.env
          echo "EVENT_DAY_THRESHOLD_PCT=4.0" >> my.env
          echo "EVENT_COOLDOWN_MINUTES=12" >> my.env
          echo "DRY_RUN=false" >> my.env

      - name: Decode Twitter session
        run: echo "${{ secrets.TWITTER_SESSION }}" | base64 -d > twitter_session.json

      - name: Run bot cycle
        run: python bot.py
        env:
          TZ: Europe/Amsterdam

      - name: Save state back to repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin main
          git reset --soft origin/main
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%H:%M)"
          git push origin main
